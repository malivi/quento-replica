version: 2

models:
  - name: fct_cdr_billing_reconciliation
    description: "Event-level revenue assurance fact table reconciling mediated network switch CDRs against OCS/postpaid billing lines."
    columns:
      - name: cdr_id
        description: "Primary identifier across network CDRs and billing records."
        tests:
          - unique
          - not_null
      - name: subscriber_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subscribers')
                field: subscriber_id
      - name: reconciliation_status
        description: "Classification of the CDR-to-billing reconciliation outcome."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'MATCHED'
                  - 'UNBILLED_CDR'
                  - 'PHANTOM_BILLING'
                  - 'BUNDLE_ALLOWANCE_ERROR'
                  - 'VOLUME_DISCREPANCY'
                  - 'RATE_DISCREPANCY'
                  - 'AMOUNT_DISCREPANCY'
      - name: revenue_leakage_amount
        tests:
          - not_null
      - name: overbilling_exposure_amount
        tests:
          - not_null

  - name: fct_subscriber_bundle_reconciliation
    description: "Subscriber-level monthly allowance and invoice subtotal reconciliation across Voice, Data, and SMS."
    columns:
      - name: subscriber_id
        tests:
          - unique
          - not_null
      - name: subscriber_reconciliation_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'RECONCILED'
                  - 'NET_OVERBILLED'
                  - 'NET_UNDERBILLED_LEAKAGE'
                  - 'OFFSETTING_DISCREPANCIES'

  - name: fct_roaming_tap_reconciliation
    description: "Wholesale roaming settlement reconciliation comparing home switch roaming CDRs against visited partner TAP3 records."
    columns:
      - name: cdr_id
        tests:
          - unique
          - not_null
      - name: partner_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_roaming_partners')
                field: partner_id
      - name: tap_reconciliation_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'MATCHED_SETTLEMENT'
                  - 'MISSING_IN_HOME_SWITCH'
                  - 'MISSING_TAP_RECORD'
                  - 'TAP_OVERCHARGE'
                  - 'TAP_UNDERCHARGE'

  - name: mart_revenue_assurance_summary
    description: "Executive Revenue Assurance KPI summary aggregating retail billing leakage, overbilling exposure, and wholesale roaming TAP disputes."
    columns:
      - name: billing_period
        tests:
          - unique
          - not_null
      - name: retail_revenue_leakage
        tests:
          - not_null
      - name: wholesale_tap_dispute_amount
        tests:
          - not_null
