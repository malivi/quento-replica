<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A private, browser-based workspace for building and exploring ontologies. Define concepts, connect knowledge, and keep your data." />
  <title>Ontology Studio</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#workspace">Skip to workspace</a>
  <div id="app"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This app needs JavaScript to edit and save ontologies in your browser.</noscript>
</body>
</html>
