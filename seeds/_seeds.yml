version: 2

seeds:
  - name: subscribers
    description: "Subscriber master directory linking MSISDNs and IMSIs to commercial rate plans."
    columns:
      - name: subscriber_id
        description: "Primary key for subscriber."
        tests:
          - unique
          - not_null
      - name: msisdn
        description: "E.164 phone number assigned to the subscriber."
        tests:
          - unique
          - not_null
      - name: plan_id
        description: "Foreign key to rate_plans."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rate_plans')
                field: plan_id

  - name: rate_plans
    description: "Commercial tariff catalog defining monthly recurring charges, bundle allowances, and overage/roaming unit rates."
    columns:
      - name: plan_id
        description: "Unique rate plan identifier."
        tests:
          - unique
          - not_null
      - name: monthly_fee
        tests:
          - not_null

  - name: roaming_partners
    description: "Wholesale roaming partner operators and bilateral/hub TAP3 rate agreements."
    columns:
      - name: partner_id
        description: "Unique roaming partner identifier."
        tests:
          - unique
          - not_null
      - name: tap_code
        description: "GSMA TADIG / TAP operator code."
        tests:
          - unique
          - not_null

  - name: raw_network_cdrs
    description: "Raw Call Detail Records (CDRs) and Usage Data Records (UDRs) captured from MSC, PGW, and SMSC network elements."
    columns:
      - name: cdr_id
        description: "Network switch CDR identifier (may contain raw mediation duplicates before staging deduplication)."
        tests:
          - not_null
      - name: subscriber_id
        tests:
          - not_null
      - name: service_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VOICE', 'DATA', 'SMS']

  - name: raw_billing_records
    description: "Rated and billed usage records generated by the Online Charging System (OCS) and postpaid billing engine."
    columns:
      - name: billing_record_id
        description: "Unique billing line identifier."
        tests:
          - unique
          - not_null
      - name: cdr_id
        description: "Reference to originating network CDR."
        tests:
          - not_null

  - name: raw_partner_tap_records
    description: "Incoming GSMA TAP3 wholesale roaming settlement records submitted by visited partner networks."
    columns:
      - name: tap_record_id
        description: "Unique TAP settlement record identifier."
        tests:
          - unique
          - not_null
      - name: partner_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('roaming_partners')
                field: partner_id
