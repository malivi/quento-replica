name: 'telco_cdr_billing_reconciliation'
version: '1.0.0'
config-version: 2

profile: 'telco_reconciliation'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Tolerance threshold (in USD) before flagging a monetary discrepancy
  amount_tolerance_usd: 0.01
  # Default billing period for reconciliation reporting
  reconciliation_period: '2026-09'

seeds:
  telco_cdr_billing_reconciliation:
    +schema: raw_seed
    subscribers:
      +column_types:
        subscriber_id: varchar
        msisdn: varchar
        imsi: varchar
        plan_id: varchar
        account_status: varchar
        activation_date: date
        billing_cycle_day: integer
        customer_segment: varchar
    rate_plans:
      +column_types:
        plan_id: varchar
        plan_name: varchar
        monthly_fee: numeric(12, 2)
        included_voice_minutes: numeric(12, 2)
        included_data_mb: numeric(12, 2)
        included_sms_count: integer
        voice_overage_rate_per_min: numeric(10, 4)
        data_overage_rate_per_mb: numeric(10, 4)
        sms_overage_rate_per_msg: numeric(10, 4)
        roaming_voice_rate_per_min: numeric(10, 4)
        roaming_data_rate_per_mb: numeric(10, 4)
        roaming_sms_rate_per_msg: numeric(10, 4)
    roaming_partners:
      +column_types:
        partner_id: varchar
        partner_name: varchar
        tap_code: varchar
        country_iso: varchar
        agreement_type: varchar
        wholesale_voice_rate_per_min: numeric(10, 4)
        wholesale_data_rate_per_mb: numeric(10, 4)
        wholesale_sms_rate_per_msg: numeric(10, 4)
    raw_network_cdrs:
      +column_types:
        cdr_id: varchar
        call_reference_id: varchar
        subscriber_id: varchar
        msisdn: varchar
        service_type: varchar
        event_timestamp: timestamp
        duration_seconds: integer
        data_volume_mb: numeric(12, 2)
        sms_count: integer
        origin_country: varchar
        destination_country: varchar
        is_roaming: boolean
        roaming_partner_id: varchar
        cell_tower_id: varchar
        network_element_id: varchar
        termination_cause: varchar
        mediation_status: varchar
    raw_billing_records:
      +column_types:
        billing_record_id: varchar
        cdr_id: varchar
        invoice_id: varchar
        subscriber_id: varchar
        billing_period: varchar
        service_type: varchar
        billed_timestamp: timestamp
        billed_duration_seconds: integer
        billed_data_volume_mb: numeric(12, 2)
        billed_sms_count: integer
        applied_unit_rate: numeric(10, 4)
        billed_amount: numeric(12, 2)
        is_bundle_covered: boolean
        tax_amount: numeric(12, 2)
        total_amount: numeric(12, 2)
    raw_partner_tap_records:
      +column_types:
        tap_record_id: varchar
        tap_file_batch_id: varchar
        call_reference_id: varchar
        cdr_id: varchar
        partner_id: varchar
        subscriber_id: varchar
        service_type: varchar
        event_timestamp: timestamp
        tap_duration_seconds: integer
        tap_data_volume_mb: numeric(12, 2)
        tap_sms_count: integer
        wholesale_charged_amount: numeric(12, 2)
        settlement_currency: varchar

models:
  telco_cdr_billing_reconciliation:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
